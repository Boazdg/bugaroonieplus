<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Automatic MP4 Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .video-button {
      border: none;
      background: none;
      cursor: pointer;
      margin: 10px;
    }

    .video-button img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border: 2px solid #555;
      border-radius: 5px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .video-button img:hover {
      transform: scale(1.05);
      border-color: #fff;
    }

    video {
      margin-top: 20px;
      max-width: 90%;
      max-height: 60vh;
      border: 2px solid #555;
      border-radius: 5px;
      background: black;
    }
  </style>
</head>
<body>

  <h1>BuggaTV</h1>

  <div id="buttons-container"></div>

  <video id="player" controls></video>

  <script>
    // --- Automatic Button Generation ---
    const videoFolder = 'videos/';
    const imageFolder = 'images/';

    // List all your videos here (or you could generate this server-side)
    const videoFiles = [
      'video1.mp4',
      'video2.mp4',
      'video3.mp4'
    ];

    const container = document.getElementById('buttons-container');
    const player = document.getElementById('player');

    videoFiles.forEach(video => {
      // Derive thumbnail name from video name
      const baseName = video.replace('.mp4', '');
      const imgSrc = imageFolder + baseName + '.jpg';

      const button = document.createElement('button');
      button.className = 'video-button';
      button.onclick = () => {
        player.src = videoFolder + video;
        player.play();
      };

      const img = document.createElement('img');
      img.src = imgSrc;
      img.alt = baseName;

      button.appendChild(img);
      container.appendChild(button);
    });
  </script>

</body>
</html>
